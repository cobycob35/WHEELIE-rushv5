<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Wheelie Rush V5 Street</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;left:8px;top:7px;font-weight:900;text-shadow:2px 2px #000;font-size:14px;pointer-events:none}#dash{position:fixed;right:7px;top:7px;background:#000d;padding:7px;border-radius:12px;text-align:right;max-width:57%}button,select{font-size:13px;padding:7px;border:0;border-radius:8px;margin:2px}.controls{position:fixed;bottom:8px;width:100%;display:flex;justify-content:space-around}.ctrl{width:19vw;height:60px;font-size:13px;font-weight:900}.wheel{background:#ffd35c}.shift{background:#b9ddff}.orange{background:#ff9c32}#msg{position:fixed;top:27%;width:100%;text-align:center;font-size:28px;font-weight:1000;text-shadow:3px 3px #000;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="hud">WHEELIE RUSH V5 STREET 🏍️<br><span id="stats"></span><br><span id="status"></span></div>
<div id="dash"><div id="bikeDash"><b id="gear">N</b> | 🌡️ <span id="temp">65°F</span> | 🔋 <span id="bat">100%</span><br><button id="down">− GEAR</button><button id="up">+ GEAR</button><button class="orange" id="choke">CHOKE OFF</button><button class="orange" id="key">🔑 START</button></div><select id="ride"></select></div>
<div id="msg"></div><div class="controls"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl wheel" id="wheel">WHEELIE</button><button class="ctrl shift" id="trick">TRICK</button><button class="ctrl" id="gas">GAS</button></div>
<script>
const C=document.querySelector('#c'),x=C.getContext('2d');let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight}resize();addEventListener('resize',resize);
const rides=[];for(let i=1;i<=10;i++)rides.push({n:`Volt E-Bike ${i}`,t:'E-BIKE',m:50+i*1.3,c:`hsl(${190+i*10} 75% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`MX Dirt Bike ${i}`,t:'DIRT BIKE',m:70+i*2,c:`hsl(${i*28} 85% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`Turbo Quad ${i}`,t:'TUNED QUAD',m:78+i*2,c:`hsl(${295+i*8} 82% 52%)`});
let idx=10,speed=0,angle=0,dist=0,score=0,battery=100,temp=65,started=false,choke=false,gear=0,rpm=900,gas=false,brake=false,wheel=false,trick=false,last=performance.now(),audio=null,lastPulse=0,turbo=0,roadScroll=0;
const S=document.querySelector('#ride');rides.forEach((r,i)=>S.add(new Option(`${i+1}. ${r.n}`,i)));S.value=10;const R=()=>rides[idx];
function ac(){if(!audio)audio=new (AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function osc(f,d,type='sine',vol=.03,end=f){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start();o.stop(t+d)}
function noise(d=.06,vol=.02,hz=1300){if(!audio)return;let n=Math.max(1,Math.floor(audio.sampleRate*d)),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=hz;f.Q.value=.7;g.gain.value=vol;s.connect(f).connect(g).connect(audio.destination);s.start()}
function startSound(){osc(72,.09,'square',.06,105);setTimeout(()=>osc(96,.11,'sawtooth',.07,145),90);setTimeout(()=>noise(.13,.04,700),190)}
function shiftFX(oldg,newg){ac();let before=Math.max(100,rpm/48);osc(before,.055,'sawtooth',.055,before*.55);noise(.045,.05,900);setTimeout(()=>{osc(before*.58,.075,'sawtooth',.045,before*.76);noise(.035,.025,1600)},60);flash(`⚙️ ${oldg||'N'} → ${newg}`)}
function bov(){noise(.24,.12,3800);osc(1800,.18,'sine',.045,500)}
function engine(){if(!audio)return;let now=performance.now();if(now-lastPulse<38)return;lastPulse=now;let r=R();
if(r.t==='DIRT BIKE'&&started){let f=45+rpm/78;osc(f,.047,'sawtooth',.032,f*.96);osc(f*2,.04,'triangle',.018,f*1.9);noise(.042,.014,700+rpm*.12);if(gas)noise(.035,.018,1700+rpm*.08)}
else if(r.t==='E-BIKE'&&(gas||speed>1)){osc(230+speed*10,.045,'sine',.021,245+speed*10)}
else if(r.t==='TUNED QUAD'&&(gas||speed>1)){osc(52+speed*4.5,.047,'sawtooth',.032);noise(.04,.014,1000);if(gas&&speed>15){turbo=Math.min(1,turbo+.045);osc(900+turbo*1900,.04,'sine',.018)}}}
function flash(s){let m=document.querySelector('#msg');m.textContent=s;clearTimeout(flash.t);flash.t=setTimeout(()=>m.textContent='',600)}
function bind(id,set){let e=document.querySelector('#'+id);e.addEventListener('pointerdown',q=>{q.preventDefault();ac();set(true)});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>set(false)))}
bind('gas',v=>{if(!v&&gas&&R().t==='TUNED QUAD'&&turbo>.25)bov();gas=v});bind('brake',v=>brake=v);bind('wheel',v=>wheel=v);bind('trick',v=>trick=v);
document.querySelector('#key').onclick=()=>{ac();if(R().t!=='DIRT BIKE')return;if(!started&&temp<78&&!choke){flash('🥶 CHOKE ON FIRST');return}started=!started;if(started){startSound();gear=0}else gear=0;update()};
document.querySelector('#choke').onclick=()=>{choke=!choke;update()};
document.querySelector('#up').onclick=()=>{if(R().t==='DIRT BIKE'&&started&&gear<5){let o=gear;gear++;shiftFX(o,gear);rpm=Math.max(1500,rpm*.62);update()}};
document.querySelector('#down').onclick=()=>{if(R().t==='DIRT BIKE'&&gear>0){let o=gear;gear--;shiftFX(o,gear||'N');rpm=Math.min(9000,rpm*1.38);update()}};
S.onchange=()=>{idx=+S.value;speed=angle=0;started=R().t!=='DIRT BIKE';gear=0;temp=65;battery=100;turbo=0;update()};
function update(){let d=R().t==='DIRT BIKE';document.querySelector('#bikeDash').style.display=d?'block':'none';document.querySelector('#gear').textContent=gear?`GEAR ${gear}`:'GEAR N';document.querySelector('#temp').textContent=`${Math.round(temp)}°F`;document.querySelector('#bat').textContent=`${Math.round(battery)}%`;document.querySelector('#choke').textContent=`CHOKE ${choke?'ON':'OFF'}`;document.querySelector('#key').textContent=started?'🔑 STOP':'🔑 START'}
function road(){let horizon=H*.46,roadTop=H*.58,roadBottom=H;x.fillStyle='#86b9dc';x.fillRect(0,0,W,horizon);x.fillStyle='#a48c6c';x.fillRect(0,horizon,W,roadTop-horizon);x.fillStyle='#303236';x.fillRect(0,roadTop,W,H-roadTop);x.fillStyle='#55585d';x.fillRect(0,roadTop,W,7);
let scroll=(roadScroll%140);x.fillStyle='#f5e8a4';for(let i=-1;i<9;i++){let px=i*140-scroll;x.fillRect(px,H*.82,78,7)}
x.fillStyle='#ddd';x.fillRect(0,H*.61,W,4);x.fillStyle='#25272a';x.fillRect(0,H*.95,W,5);
let par=(roadScroll*.24)%240;for(let i=-1;i<7;i++){let px=i*240-par;x.fillStyle='#5b6d47';x.fillRect(px,horizon-65,8,65);x.beginPath();x.arc(px+4,horizon-70,28,0,7);x.fill()}let far=(roadScroll*.12)%360;x.fillStyle='#777';for(let i=-1;i<5;i++){let px=i*360-far;x.fillRect(px,horizon-48,100,48);x.fillStyle='#444';x.fillRect(px+12,horizon-35,15,18);x.fillRect(px+48,horizon-35,15,18);x.fillStyle='#777'}}
function wheelPic(px,py,r,spin){x.save();x.translate(px,py);x.rotate(spin);x.fillStyle='#101010';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#aaa';x.lineWidth=3;x.beginPath();x.arc(0,0,r-6,0,7);x.stroke();x.strokeStyle='#777';x.lineWidth=1;for(let a=0;a<6.3;a+=.4){x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*(r-7),Math.sin(a)*(r-7));x.stroke()}x.restore()}
function bike(cx,cy,r){let spin=roadScroll*.035;x.save();x.translate(cx,cy);x.rotate(-angle);wheelPic(-53,22,24,spin);wheelPic(55,22,24,spin);x.strokeStyle='#b9b9b9';x.lineWidth=5;x.beginPath();x.moveTo(-53,22);x.lineTo(-8,7);x.lineTo(26,-23);x.lineTo(55,22);x.stroke();x.strokeStyle=r.c;x.lineWidth=7;x.beginPath();x.moveTo(-8,7);x.lineTo(-29,-27);x.lineTo(24,-23);x.lineTo(-8,7);x.stroke();x.fillStyle='#4d4d4d';x.roundRect(-20,-5,38,31,5);x.fill();x.fillStyle='#222';x.fillRect(-12,0,21,21);for(let i=0;i<5;i++){x.strokeStyle='#999';x.lineWidth=1;x.beginPath();x.moveTo(-13,2+i*4);x.lineTo(11,2+i*4);x.stroke()}x.strokeStyle='#aaa';x.lineWidth=5;x.beginPath();x.moveTo(14,15);x.quadraticCurveTo(-7,29,-45,2);x.stroke();x.fillStyle='#aaa';x.roundRect(-53,-3,29,8,3);x.fill();x.fillStyle=r.c;x.beginPath();x.moveTo(-32,-34);x.lineTo(17,-36);x.lineTo(33,-19);x.lineTo(-16,-13);x.closePath();x.fill();x.fillStyle='#111';x.roundRect(-47,-42,64,9,4);x.fill();let bend=Math.max(0,angle-.16)*40;x.fillStyle=r.c;x.beginPath();x.moveTo(-41,-39);x.quadraticCurveTo(-63,-48-bend*.3,-85,-36-bend);x.lineTo(-81,-28-bend*.8);x.quadraticCurveTo(-59,-35-bend*.15,-38,-31);x.fill();x.beginPath();x.moveTo(31,-26);x.quadraticCurveTo(56,-37,78,-20);x.lineTo(72,-13);x.quadraticCurveTo(53,-24,33,-16);x.fill();x.strokeStyle='#333';x.lineWidth=4;x.beginPath();x.moveTo(27,-32);x.lineTo(36,-52);x.lineTo(50,-54);x.stroke();x.fillStyle='#202020';x.beginPath();x.arc(2,-70,11,0,7);x.fill();x.strokeStyle='#242424';x.lineWidth=9;x.beginPath();x.moveTo(1,-58);x.lineTo(-10,-34);x.lineTo(6,-20);x.moveTo(-4,-54);x.lineTo(25,-44);x.lineTo(41,-50);x.moveTo(-7,-32);x.lineTo(-30,-2);x.lineTo(-49,13);x.stroke();x.restore()}
function simple(cx,cy,r){let spin=roadScroll*.035;x.save();x.translate(cx,cy);x.rotate(-angle);wheelPic(-48,22,23,spin);wheelPic(48,22,23,spin);x.fillStyle=r.c;x.roundRect(-48,-13,96,26,6);x.fill();x.fillStyle='#222';x.fillRect(-18,-25,39,14);x.restore()}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t,r=R();if(r.t==='DIRT BIKE'&&started){temp=Math.min(110,temp+dt*((choke?8:3.5)+(gas?3:0)));battery=Math.max(0,battery-dt*(gas?.08:.01));if(!battery){started=false;gear=0}}
let can=r.t!=='DIRT BIKE'||(started&&battery>0),acc=0;if(can){if(r.t==='DIRT BIKE'){let caps=[0,26,43,61,78,r.m],mins=[0,0,18,32,48,63];if(gear>0){let cap=caps[gear];acc=gas*(gear===1?40:gear===2?34:gear===3?29:gear===4?25:22);if(speed>cap)acc-=25;if(speed<mins[gear]&&gear>1)acc*=.5;rpm=1100+(speed/Math.max(1,cap))*7200+(gas?650:0);rpm=Math.min(9200,rpm)}else{rpm=900+(gas?3800:0);acc=0}}else acc=gas?38:0;speed+=(acc-(brake?55:5.5))*dt;speed=Math.max(0,Math.min(r.m,speed));let target=wheel&&speed>8?Math.min(1.03,.2+speed/110):0;angle+=(target-angle)*4.3*dt;if(angle>.35&&speed>10)score+=speed*dt*.6;dist+=speed*dt/3.6}else speed=Math.max(0,speed-18*dt);
roadScroll+=speed*dt*5.2;engine();road();let bx=W*.43,by=H*.58-28;r.t==='DIRT BIKE'?bike(bx,by,r):simple(bx,by,r);document.querySelector('#stats').innerHTML=`${r.n}<br>${speed.toFixed(0)} MPH • ${Math.round(rpm)} RPM • ⭐ ${Math.floor(score)}`;document.querySelector('#status').textContent=r.t==='DIRT BIKE'?(started?(gear?`🟢 GEAR ${gear}`:'🟢 NEUTRAL — SHIFT UP'):'⚫ ENGINE OFF'):(r.t==='TUNED QUAD'?`💨 TURBO ${Math.round(turbo*100)}%`:'⚡ READY');update();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
